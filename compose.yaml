services:
  app:
    build: .
    restart: unless-stopped
    environment:
      OFFICE_ORIGIN: ${OFFICE_ORIGIN:-http://localhost:8080}
      # The supplied NGINX terminates HTTP only. Use 1 behind HTTPS in production.
      OFFICE_SECURE_COOKIES: ${OFFICE_SECURE_COOKIES:-0}
      TRUST_PROXY: "1"
    volumes:
      - office-data:/app/.data
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
volumes:
  office-data:
