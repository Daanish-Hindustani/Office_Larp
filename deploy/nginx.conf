# Container deployment. For a host installation, use 127.0.0.1:4173
# instead of app:4173 and set server_name to your public hostname.
server {
    listen 80;
    server_name _;
    client_max_body_size 16k;

    location / {
        proxy_pass http://app:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }

    location = /api/world/events {
        proxy_pass http://app:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        add_header X-Accel-Buffering no;
    }
}
